[package]
name = "textdistancerust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
num = "0.4"

[lib]
name = "textdistancerust"
path = "src/lib.rs"

[[bin]]
name = "textdistancerust-cli"
path = "src/main.rs"

[[bin]]
name = "tdcli"
path = "src/bin/tdcli.rs"

[[bin]]
name = "integration_tests"
path = "src/bin/integration_tests.rs"

